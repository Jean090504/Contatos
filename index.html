<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer type="module"></script>
    <title>Lista de Contatos</title>
</head>
<body>
    <header>
        <div class="escopo"> 
            <div class="logo-titulo">
                <h1 class="titulo">Lista de Contatos</h1>
            </div>
            <button class="novo-contato" id="btnNovoContato">+ Novo Contato</button>
        </div>
        <div class="buscar">
            <input type="text" id="inputBuscar" placeholder="Digite para buscar...">
            <button class="buscar-contato" id="btnBuscar">Buscar</button>
        </div>
    </header>

    <main>
        <div id="containerContatos" class="grade-contatos"></div>
    </main>

    <div id="modalContato" class="modal container-escondido">
        <div class="modal-conteudo">
            <h2>Adicionar Novo Registro</h2>
            <form id="formContato">
                <input type="text" id="nomeContato" placeholder="Nome" required>
                <input type="tel" id="telContato" placeholder="Telefone" required>
                <input type="url" id="fotoContato" placeholder="Link da foto (URL)">
                <input type="email" id="emailContato" placeholder="E-mail">
                <input type="text" id="enderecoContato" placeholder="Endereço">
                <input type="text" id="cidadeContato" placeholder="Cidade">
                
                <div class="botoes-modal">
                    <button type="button" id="btnCancelar">Cancelar</button>
                    <button type="submit" id="btnSalvar">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
